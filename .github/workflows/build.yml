name: Rust Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: ecosim-linux
            asset_name: ecosim
          - os: windows-latest
            artifact_name: ecosim-windows
            asset_name: ecosim.exe
          - os: macos-latest
            artifact_name: ecosim-macos
            asset_name: ecosim

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ pkg-config libx11-dev libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          # Rust 1.100.0 regressed objc2 builds on macOS (rust-lang/rust#166229)
          toolchain: 1.99.0

      - name: Rust Cache
        uses: swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release

      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          cp -r assets dist/
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            cp target/release/ecosim.exe dist/
            7z a -tzip ${{ matrix.artifact_name }}.zip ./dist/*
          else
            cp target/release/ecosim dist/
            tar -czf ${{ matrix.artifact_name }}.tar.gz -C dist .
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ecosim-*.*

  release:
    name: GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/ecosim-*.*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
